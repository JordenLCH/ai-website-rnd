<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Blackdash preview</title>
    <style>
      body { margin: 0; font: 14px/1.4 var(--font-sans, system-ui, sans-serif); color: var(--color-text-primary, #141413); background: var(--color-background-primary, #fff); }
      #bar { padding: 8px 12px; border-bottom: var(--border-width-regular, .5px) solid var(--color-border-tertiary, #ddd); font-weight: 600; }
      #bar[data-state="error"] { background: var(--color-background-danger, #f7ecec); color: var(--color-text-danger, #7f2c28); }
      #bar[data-state="ok"] { background: var(--color-background-success, #e9f1dc); color: var(--color-text-success, #265b19); }
      #tabs { display: flex; gap: 6px; padding: 8px 12px; flex-wrap: wrap; }
      #tabs button { font: inherit; padding: 4px 10px; border-radius: var(--border-radius-full, 9999px); border: var(--border-width-regular, .5px) solid var(--color-border-primary, #999); background: transparent; color: inherit; cursor: pointer; }
      #tabs button:disabled { background: var(--color-background-inverse, #141413); color: var(--color-text-inverse, #fff); cursor: default; }
      #stage { border-top: var(--border-width-regular, .5px) solid var(--color-border-tertiary, #ddd); }
    </style></head>
  <body>
    <div id="bar"></div>
    <div id="tabs"></div>
    <div id="stage"></div>
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
